<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b²c settings</title>
<link rel="stylesheet" href="../tokens.css">
<!--
  b²c settings page prototype (options_page). Design, 2026-10-19.
  Spec: ../settings.md "Settings page" and sections 1-7.

  Rendered from one declarative list, SECTIONS, the way Dev renders from the
  schema: each row names its key(s), control, default, and the feature it
  depends on. Search, per-row reset, section reset and dimming all read that
  list. Components (port one to one to Preact): Row, Switch, Segmented,
  StyleChips, Select, Stepper, TimeRange, ColorWell (+ ContrastReadout),
  Checks, Sliders, CodeField, GradeScale, Courses, Disclosure, Toast.
  Keys marked (placeholder) are not in dev/schema.json yet.
  Revised 2026-10-19 (r2): Gray preset, school link/nav, Reminders shelved,
  new rows from settings.md r2, About + Reset all placement.
-->
<style>
  :root { --b2c-sidebar-w: 200px; }   /* page-local layout value */

  * { box-sizing: border-box; }
  html { color-scheme: light dark; scroll-padding-top: var(--b2c-space-6); }
  body {
    margin: 0;
    background: var(--b2c-ui-bg);
    color: var(--b2c-ui-text);
    font: var(--b2c-weight-regular) var(--b2c-text-md)/var(--b2c-leading) var(--b2c-font-ui);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus { outline: none; }
  :focus-visible {
    outline: var(--b2c-focus-ring-w) solid var(--b2c-ui-focus);
    outline-offset: 2px;
  }
  svg { display: block; flex: none; }
  [hidden] { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: var(--b2c-sidebar-w) minmax(0, var(--b2c-settings-max-w));
    column-gap: var(--b2c-space-8);
    justify-content: center;
    padding: 0 var(--b2c-space-6);
  }
  .side {
    position: sticky; top: 0; align-self: start;
    height: 100vh; padding: var(--b2c-space-8) 0 var(--b2c-space-6);
    display: flex; flex-direction: column; gap: var(--b2c-space-4);
  }
  h1 {
    margin: 0; padding: 0 var(--b2c-space-2);
    font-size: var(--b2c-text-xl); line-height: var(--b2c-leading-tight);
    font-weight: var(--b2c-weight-bold); letter-spacing: -0.01em;
  }
  main { padding: var(--b2c-space-8) 0 30vh; min-width: 0; }

  /* ── Search ── */
  .search { position: relative; }
  .search svg { position: absolute; left: var(--b2c-space-2); top: 7px; color: var(--b2c-ui-text-secondary); pointer-events: none; }
  .search input {
    width: 100%; height: var(--b2c-control-h);
    padding: 0 var(--b2c-space-6) 0 28px;
    border: 0; border-radius: var(--b2c-radius-md);
    background: var(--b2c-ui-control);
  }
  .search input::placeholder { color: var(--b2c-ui-text-secondary); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search kbd {
    position: absolute; right: var(--b2c-space-1-5); top: 5px;
    min-width: 18px; height: 18px; padding: 0 var(--b2c-space-1);
    display: grid; place-items: center;
    font: var(--b2c-text-xs)/1 var(--b2c-font-ui); color: var(--b2c-ui-text-secondary);
    border-radius: var(--b2c-radius-sm);
    box-shadow: inset 0 0 0 1px var(--b2c-ui-separator);
  }
  .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }

  /* ── Section index ── */
  nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--b2c-space-0-5); }
  nav a {
    display: flex; align-items: center; height: var(--b2c-control-h);
    padding: 0 var(--b2c-space-2); border-radius: var(--b2c-radius-md);
    color: var(--b2c-ui-text); text-decoration: none;
    transition: background-color var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  nav a:hover { background: color-mix(in srgb, var(--b2c-ui-text) 5%, transparent); }
  nav a[aria-current="true"] { background: var(--b2c-ui-control); font-weight: var(--b2c-weight-medium); }
  nav a.no-match { color: var(--b2c-ui-text-disabled); }

  /* ── Sections ── */
  section { margin-bottom: var(--b2c-space-8); }
  section[hidden] { display: none; }
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    height: var(--b2c-control-h); margin: 0 0 var(--b2c-space-2); padding: 0 var(--b2c-space-3);
  }
  h2 { margin: 0; font-size: var(--b2c-text-lg); font-weight: var(--b2c-weight-bold); }
  .group {
    background: var(--b2c-ui-panel);
    border-radius: var(--b2c-radius-lg);
    box-shadow: var(--b2c-ui-shadow);
    overflow: hidden;
  }
  .empty {
    padding: var(--b2c-space-8) var(--b2c-space-3); text-align: center;
    color: var(--b2c-ui-text-secondary);
  }

  /* ── Rows ── */
  .row {
    --indent: 0px;
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; column-gap: var(--b2c-space-2);
    min-height: var(--b2c-row-h);
    padding: var(--b2c-space-1-5) var(--b2c-space-3) var(--b2c-space-1-5) calc(var(--b2c-space-3) + var(--indent));
    transition: background-color var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  .row[data-depth="1"] { --indent: var(--b2c-space-6); }
  .row[data-depth="2"] { --indent: calc(2 * var(--b2c-space-6)); }
  .row:not(.first)::before {
    content: ""; position: absolute; top: 0; right: 0;
    left: calc(var(--b2c-space-3) + var(--indent));
    height: 1px; background: var(--b2c-ui-separator);
  }
  .row[hidden] { display: none; }
  .row.switch-row { cursor: pointer; }
  .row.switch-row:hover { background: var(--b2c-ui-panel-hover); }
  .row.is-disabled.switch-row { cursor: default; }
  .row.is-disabled.switch-row:hover { background: none; }
  .row-text { min-width: 0; padding: var(--b2c-space-0-5) 0; }
  .row-label { display: block; }
  .row-desc { display: block; margin-top: 1px; font-size: var(--b2c-text-sm); line-height: var(--b2c-leading-tight); color: var(--b2c-ui-text-secondary); }
  .is-disabled .row-label, .is-disabled .row-desc { color: var(--b2c-ui-text-disabled); }
  .is-disabled .ctl, .is-disabled .block { opacity: .5; }
  .ctl { display: flex; align-items: center; gap: var(--b2c-space-2); justify-self: end; }
  .block { grid-column: 1 / -1; margin-top: var(--b2c-space-1); margin-bottom: var(--b2c-space-1); }
  .row.bare { grid-template-columns: minmax(0, 1fr); }
  .row.bare > .row-text, .row.bare > .reset, .row.bare > .ctl { display: none; }
  .row.bare > .block { margin: 0; }
  .list-item > .btn.quiet { margin-right: calc(-1 * var(--b2c-space-1-5)); }
  mark { background: color-mix(in srgb, var(--b2c-ui-accent) 24%, transparent); color: inherit; border-radius: 2px; }

  /* per-row reset: space is reserved, so showing it never shifts the row */
  .reset {
    width: 24px; height: 24px; padding: 0; display: grid; place-items: center;
    border: 0; border-radius: var(--b2c-radius-sm); background: none;
    color: var(--b2c-ui-text-secondary);
    visibility: hidden; opacity: 0;
    transition: opacity var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  .row.nondefault:hover > .reset, .row.nondefault:focus-within > .reset { visibility: visible; opacity: 1; }
  .reset:hover { background: var(--b2c-ui-control); color: var(--b2c-ui-text); }

  /* ── Buttons ── */
  .btn {
    height: var(--b2c-control-h); padding: 0 var(--b2c-space-3);
    display: inline-flex; align-items: center; gap: var(--b2c-space-1-5);
    border: 0; border-radius: var(--b2c-radius-md);
    background: var(--b2c-ui-control); white-space: nowrap;
    transition: filter var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  .btn:hover:not(:disabled) { filter: brightness(0.96); }
  @media (prefers-color-scheme: dark) { .btn:hover:not(:disabled) { filter: brightness(1.15); } }
  .btn.primary { background: var(--b2c-ui-accent-fill); color: #fff; font-weight: var(--b2c-weight-medium); }
  .btn.quiet { background: none; color: var(--b2c-ui-accent); padding: 0 var(--b2c-space-1-5); }
  .btn.quiet:hover:not(:disabled) { background: color-mix(in srgb, var(--b2c-ui-accent) 10%, transparent); filter: none; }
  /* danger text sits on the panel, not the control fill (4.49:1 there) */
  .btn.danger { color: var(--b2c-ui-danger); background: none; }
  a.btn { text-decoration: none; }
  .ctl > .btn.quiet:last-child { margin-right: calc(-1 * var(--b2c-space-1-5)); }
  .row.bare > .block > .btn.quiet { margin-left: calc(-1 * var(--b2c-space-1-5)); }
  .btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--b2c-ui-danger) 10%, transparent); filter: none; }
  .btn:disabled { opacity: .5; }
  .sec-head .btn.quiet { font-size: var(--b2c-text-sm); visibility: hidden; }
  .sec-head.nondefault .btn.quiet { visibility: visible; }

  /* ── Switch ── */
  [role="switch"] {
    flex: none; position: relative;
    width: var(--b2c-switch-w); height: var(--b2c-switch-h); padding: 0;
    border: 0; border-radius: var(--b2c-radius-full);
    background: var(--b2c-ui-control);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--b2c-ui-text) 8%, transparent);
    transition: background-color var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  [role="switch"]::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: var(--b2c-radius-sm);
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transition: transform var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  [role="switch"][aria-checked="true"] { background: var(--b2c-ui-accent-fill); box-shadow: none; }
  [role="switch"][aria-checked="true"]::after { transform: translateX(14px); }

  /* ── Segmented ── */
  .seg {
    display: flex; gap: var(--b2c-space-0-5);
    height: var(--b2c-control-h); padding: var(--b2c-space-0-5);
    background: var(--b2c-ui-control); border-radius: var(--b2c-radius-md);
  }
  .seg [role="radio"] {
    padding: 0 var(--b2c-space-3); border: 0; border-radius: var(--b2c-radius-sm);
    background: transparent; white-space: nowrap;
    transition: background-color var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  .seg [role="radio"]:hover:not([aria-checked="true"]):not(:disabled) { background: color-mix(in srgb, var(--b2c-ui-text) 6%, transparent); }
  .seg [role="radio"][aria-checked="true"] {
    background: var(--b2c-ui-control-thumb); box-shadow: var(--b2c-ui-shadow);
    font-weight: var(--b2c-weight-medium);
  }
  .seg [role="radio"]:focus-visible { outline-offset: 0; }

  /* ── Style chips ── */
  .chips { display: flex; gap: var(--b2c-space-3); padding: var(--b2c-space-1) 0; }
  /* Style chip: a 64×40 Canvas page in the preset: bg, nav strip, a surface card
     with one text line and one link line. Name below. */
  .chip {
    flex: none; width: 64px; padding: 0; border: 0; background: none;
    display: flex; flex-direction: column; align-items: center; gap: var(--b2c-space-1);
    font-size: var(--b2c-text-sm); color: var(--b2c-ui-text-secondary);
  }
  .chip[hidden] { display: none; }
  .mini {
    position: relative; width: 100%; height: 40px; overflow: hidden;
    border-radius: var(--b2c-radius-md); background: var(--c-bg);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--b2c-ui-text) 14%, transparent);
    transition: box-shadow var(--b2c-dur-fast) var(--b2c-ease-out);
  }
  .mini::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 8px; background: var(--c-nav); }
  .mini .card { position: absolute; left: 16px; right: 8px; top: 8px; bottom: 8px; border-radius: var(--b2c-radius-sm); background: var(--c-surface); }
  .mini .card i { display: block; height: 3px; margin: 6px 6px 0; border-radius: 2px; background: var(--c-text); width: 55%; }
  .mini .card i + i { margin-top: 4px; background: var(--c-link); width: 38%; }
  .chip[aria-checked="true"] { color: var(--b2c-ui-text); font-weight: var(--b2c-weight-medium); }
  .chip[aria-checked="true"] .mini { box-shadow: 0 0 0 2px var(--b2c-ui-panel), 0 0 0 4px var(--b2c-ui-accent); }
  .chip:focus-visible { outline: none; }
  .chip:focus-visible .mini { outline: var(--b2c-focus-ring-w) solid var(--b2c-ui-focus); outline-offset: 6px; }

  /* ── Inputs ── */
  .field, .select select, .stepper, textarea.code, .hex {
    border: 0; border-radius: var(--b2c-radius-md);
    background: var(--b2c-ui-control);
  }
  .field { height: var(--b2c-control-h); padding: 0 var(--b2c-space-2); font-variant-numeric: tabular-nums; }
  .field.num { width: 64px; text-align: right; }
  .field::-webkit-calendar-picker-indicator { display: none; }
  .select { position: relative; display: inline-flex; }
  .select select {
    appearance: none; height: var(--b2c-control-h);
    padding: 0 28px 0 var(--b2c-space-3); min-width: 140px;
  }
  .select svg { position: absolute; right: var(--b2c-space-2); top: 8px; pointer-events: none; color: var(--b2c-ui-text-secondary); }
  .time-label { color: var(--b2c-ui-text-secondary); }

  /* Stepper: − value +, typeable, arrow keys (role=spinbutton) */
  .stepper { display: inline-flex; align-items: center; height: var(--b2c-control-h); }
  .stepper button {
    width: 28px; height: 100%; padding: 0; border: 0; background: none;
    display: grid; place-items: center; border-radius: var(--b2c-radius-md);
  }
  .stepper button:hover:not(:disabled) { background: color-mix(in srgb, var(--b2c-ui-text) 7%, transparent); }
  .stepper button:disabled { color: var(--b2c-ui-text-disabled); }
  .stepper input {
    width: 32px; height: 100%; padding: 0; border: 0; background: none;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .stepper input:focus-visible { outline-offset: -2px; border-radius: var(--b2c-radius-sm); }

  /* Disclosure: the row label is the button */
  .disclosure {
    display: inline-flex; align-items: center; gap: var(--b2c-space-1);
    margin-left: -2px; padding: 0 var(--b2c-space-1) 0 0; border: 0; background: none;
    border-radius: var(--b2c-radius-sm);
  }
  .disclosure svg { color: var(--b2c-ui-text-secondary); transition: transform var(--b2c-dur-base) var(--b2c-ease-out); }
  .disclosure[aria-expanded="true"] svg { transform: rotate(90deg); }
  .strip { display: flex; height: 16px; border-radius: var(--b2c-radius-sm); overflow: hidden; box-shadow: 0 0 0 1px var(--b2c-ui-separator); }
  .strip span { width: 10px; }

  /* Color wells */
  .wells { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; column-gap: var(--b2c-space-4); }
  .wells h3 {
    margin: 0 0 var(--b2c-space-1); font-size: var(--b2c-text-sm); font-weight: var(--b2c-weight-medium);
    color: var(--b2c-ui-text-secondary);
  }
  .well { display: grid; grid-template-columns: 24px minmax(80px, auto) 68px; align-items: center; column-gap: var(--b2c-space-2); min-height: 32px; padding: var(--b2c-space-0-5) 0; }
  .well:has(.icon-btn), [role="group"]:has(.icon-btn) .well { grid-template-columns: 24px minmax(80px, auto) 68px 20px; }
  .readout .warn { display: block; }
  .well-name { min-width: 0; line-height: var(--b2c-leading-tight); }
  .readout { display: block; font-size: var(--b2c-text-xs); color: var(--b2c-ui-text-secondary); font-variant-numeric: tabular-nums; }
  .readout.low { color: var(--b2c-ui-danger); }
  .hex::placeholder { color: var(--b2c-ui-text-secondary); opacity: 1; font-family: var(--b2c-font-ui); text-transform: none; }
  .well .icon-btn { width: 20px; height: 20px; }
  .well input[type="color"] {
    appearance: none; width: 24px; height: 24px; padding: 0; border: 0;
    border-radius: var(--b2c-radius-sm); background: none; cursor: pointer;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--b2c-ui-text) 18%, transparent);
  }
  .well input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .well input[type="color"]::-webkit-color-swatch { border: 0; border-radius: var(--b2c-radius-sm); }
  .hex {
    width: 68px; height: 24px; padding: 0 var(--b2c-space-1-5);
    font: var(--b2c-text-sm)/1 var(--b2c-font-mono); text-transform: lowercase;
  }
  .hex[aria-invalid="true"] { box-shadow: inset 0 0 0 1px var(--b2c-ui-danger); }

  /* Code field */
  textarea.code {
    display: block; width: 100%; min-height: calc(8 * 1.5em + 2 * var(--b2c-space-2));
    padding: var(--b2c-space-2); resize: vertical;
    font: var(--b2c-text-sm)/1.5 var(--b2c-font-mono); tab-size: 2;
  }
  textarea.code::placeholder { color: var(--b2c-ui-text-secondary); }

  /* Grade scale table */
  table.scale { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.scale th {
    padding: 0 var(--b2c-space-2) var(--b2c-space-1) 0; text-align: left;
    font-size: var(--b2c-text-sm); font-weight: var(--b2c-weight-medium); color: var(--b2c-ui-text-secondary);
  }
  table.scale td { padding: var(--b2c-space-0-5) var(--b2c-space-2) var(--b2c-space-0-5) 0; }
  table.scale .field { height: 24px; }
  table.scale .letter { width: 56px; }
  table.scale .num { width: 72px; }
  .icon-btn {
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--b2c-radius-sm);
    display: grid; place-items: center; background: none; color: var(--b2c-ui-text-secondary);
  }
  .icon-btn:hover:not(:disabled) { background: var(--b2c-ui-control); color: var(--b2c-ui-text); }
  .block-foot { display: flex; gap: var(--b2c-space-2); margin-top: var(--b2c-space-2); }

  .foot { margin: var(--b2c-space-2) 0 0; font-size: var(--b2c-text-sm); color: var(--b2c-ui-text-secondary); }
  .inline-checks { display: flex; gap: var(--b2c-space-4); }
  .inline-checks label { display: inline-flex; align-items: center; gap: var(--b2c-space-1-5); }
  .inline-checks input, .checks input { accent-color: var(--b2c-ui-accent-fill); width: 14px; height: 14px; margin: 0; }

  /* Card layout sliders */
  .sliders { display: grid; gap: var(--b2c-space-1); max-width: 480px; }
  .slider { display: grid; grid-template-columns: 96px minmax(0, 1fr) 56px 24px; align-items: center; column-gap: var(--b2c-space-3); height: 28px; }
  .slider input[type="range"] { width: 100%; margin: 0; accent-color: var(--b2c-ui-accent-fill); }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--b2c-ui-text-secondary); }
  .slider .reset { visibility: hidden; opacity: 0; }
  .slider.nondefault .reset { visibility: visible; opacity: 1; }

  /* GPA courses */
  .courses { display: grid; grid-template-columns: minmax(0, 1fr) 64px 112px 48px; align-items: center; gap: var(--b2c-space-1) var(--b2c-space-3); }
  .courses .th { font-size: var(--b2c-text-sm); font-weight: var(--b2c-weight-medium); color: var(--b2c-ui-text-secondary); }
  .courses .need { display: block; font-size: var(--b2c-text-sm); color: var(--b2c-ui-danger); }
  .courses .select select { min-width: 0; width: 112px; height: 24px; }
  .courses .select svg { top: 6px; }
  .courses .field.num { width: 64px; height: 24px; }
  .courses > :nth-child(4n) { justify-self: end; }

  /* Lists (hidden cards, sites) and backup panels */
  .list { display: grid; gap: var(--b2c-space-1); }
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: var(--b2c-space-3); min-height: 28px; }
  .list-item small { color: var(--b2c-ui-text-secondary); font-size: var(--b2c-text-sm); }
  .checks { display: flex; flex-wrap: wrap; gap: var(--b2c-space-1) var(--b2c-space-4); }
  .checks label { display: inline-flex; align-items: center; gap: var(--b2c-space-1-5); height: 24px; }
  .panel-foot { display: flex; align-items: center; gap: var(--b2c-space-2); margin-top: var(--b2c-space-3); }
  .panel-foot .spacer { flex: 1; }
  .status { font-size: var(--b2c-text-sm); color: var(--b2c-ui-text-secondary); }
  .value { color: var(--b2c-ui-text-secondary); font-variant-numeric: tabular-nums; }

  /* ── Toast (10 s Undo; pauses while hovered or focused) ── */
  .toast {
    position: fixed; left: 50%; bottom: var(--b2c-space-6);
    display: flex; align-items: center; gap: var(--b2c-space-3);

    }
    case "sites": block = SitesList(); break;
  }

  const reset = def.noReset ? h("span") : h("button", { class: "reset", type: "button", tabindex: "-1" }, icon("reset"));
  if (!def.noReset) {
    const name = def.resetLabel || def.label.toLowerCase();
    reset.setAttribute("aria-label", `Reset ${name}`); reset.title = "Reset to default";
    reset.addEventListener("click", () => withUndo(`Reset ${name}`, () => resetRow(def)));
  }
  el.append(textCol, reset, ctl);
  if (block) { if (!block.classList.contains("block")) block = h("div", { class: "block" }, block); el.append(block); }
  if (def.in) el.id = def.in + "-region";   // the region a disclosure's aria-controls names

  const r = { def, el, sec, labelEl, descEl };
  ROWS.push(r);
  watch(() => {
    const enabled = def.enabledIf ? !!def.enabledIf() : true;
    el.classList.toggle("is-disabled", !enabled);
    el.querySelectorAll("button:not(.reset), input, select, textarea").forEach(c => { c.disabled = !enabled; });
    const nd = !def.noReset && !isDefault(def);
    el.classList.toggle("nondefault", nd);
    if (!def.noReset) reset.tabIndex = nd ? 0 : -1;
    if (descEl && !query) {
      const d = typeof def.desc === "function" ? def.desc() : def.desc;
      descEl.textContent = d || ""; descEl.hidden = !d;
    }
  });
  return el;
}

function exportPanel(kind) {
  const parts = kind === "look" ? ["Dark mode colors", "Card colors", "Card images and names", "Font", "Custom CSS"] : null;
  const kids = [];
  if (parts) kids.push(h("div", { class: "checks", role: "group", "aria-label": "Include" },
    parts.map(p => h("label", {}, h("input", { type: "checkbox", checked: true }), p))));
  const copy = h("button", { class: "btn", type: "button" }, "Copy");
  copy.addEventListener("click", () => showToast(kind === "look" ? "Look copied as JSON" : "Settings copied as JSON"));
  const save = h("button", { class: "btn primary", type: "button" }, "Save file…");
  save.addEventListener("click", () => showToast(`Saved b2c-${kind === "look" ? "look" : "settings"}-2026-10-19.json`));
  kids.push(h("div", { class: "panel-foot" }, h("span", { class: "status" }, "JSON, schema version 1"), h("span", { class: "spacer" }), copy, save));
  return kids;
}
function importPanel(kind) {
  const taId = nid("imp");
  const ta = h("textarea", { class: "code", id: taId, rows: "4", spellcheck: "false", "aria-label": kind === "look" ? "Look to import" : "Settings to import",
    placeholder: kind === "look" ? "Paste a look here, or choose a file." : "Paste a backup here, or choose a file." });
  ta.style.minHeight = "0";
  const status = h("span", { class: "status", role: "status" });
  const choose = h("button", { class: "btn", type: "button" }, "Choose file…");
  const apply = h("button", { class: "btn primary", type: "button", disabled: true }, "Apply");
  ta.addEventListener("input", () => {
    const has = ta.value.trim().length > 0;
    apply.disabled = !has;
    status.textContent = has ? (kind === "look" ? "Previewing in your open Canvas tab" : "Ready to apply") : "";
  });
  apply.addEventListener("click", () => withUndo(kind === "look" ? "Look applied" : "Settings imported", () => {}));
  return [ta, h("div", { class: "panel-foot" }, status, h("span", { class: "spacer" }), choose, apply)];
}
function SitesList() {
  const key = "sites.list";
  const list = h("div", { class: "list" });
  const addRow = h("div", { class: "list-item", hidden: true });
  const inp = h("input", { class: "field", type: "text", placeholder: "canvas.example.edu", "aria-label": "Canvas address", spellcheck: "false" });
  inp.style.flex = "1";
  const ok = h("button", { class: "btn primary", type: "button" }, "Add");
  const cancel = h("button", { class: "btn", type: "button" }, "Cancel");
  const addBtn = h("button", { class: "btn quiet", type: "button" }, icon("plus"), "Add site…");
  const close = () => { addRow.hidden = true; addBtn.hidden = false; inp.value = ""; };
  addBtn.addEventListener("click", () => { addRow.hidden = false; addBtn.hidden = true; inp.focus(); });
  cancel.addEventListener("click", () => { close(); addBtn.focus(); });
  const submit = () => {
    const host = inp.value.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "").toLowerCase();
    if (!host) return;
    close();  // extension: chrome.permissions.request({ origins: [`https://${host}/*`] }) first
    withUndo(`Added ${host}`, () => { state[key] = [...state[key], host]; });
  };
  ok.addEventListener("click", submit);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); if (e.key === "Escape") { close(); addBtn.focus(); } });
  addRow.append(inp, h("span", { style: "display:flex;gap:8px" }, cancel, ok));
  watch(() => list.replaceChildren(...state[key].map((host, i) => {
    const rm = h("button", { class: "btn quiet", type: "button", "aria-label": `Remove ${host}` }, "Remove");
    rm.addEventListener("click", () => withUndo(`Removed ${host}`, () => { state[key] = state[key].filter(x => x !== host); }));
    return h("div", { class: "list-item" }, h("span", {}, host, i === 0 ? h("small", {}, "  Example University") : null), rm);
  })));
  return h("div", {}, list, addRow, h("div", { class: "block-foot" }, addBtn));
}

/* ═════════════════ Build page ═════════════════ */
const main = document.getElementById("main"), index = document.getElementById("index");
const SECS = [];
for (const s of SECTIONS) {
  const hid = s.id + "-h";
  const resetBtn = h("button", { class: "btn quiet", type: "button" }, "Reset section");
  resetBtn.setAttribute("aria-label", `Reset ${s.title} to defaults`);
  resetBtn.addEventListener("click", () => withUndo(`${s.title} reset to defaults`, () => s.rows.forEach(d => !d.noReset && resetRow(d))));
  const head = h("div", { class: "sec-head" }, h("h2", { id: hid, tabindex: "-1" }, s.title), resetBtn);
  const group = h("div", { class: "group" });
  const sec = h("section", { id: s.id, "aria-labelledby": hid }, head, group);
  s.rows.forEach(d => group.append(Row(d, s)));
  main.append(sec);
  const a = h("a", { href: "#" + s.id, id: "nav-" + s.id }, s.title);
  index.append(h("li", {}, a));
  SECS.push({ s, sec, head, group, a });
  watch(() => head.classList.toggle("nondefault", s.rows.some(d => !d.noReset && !isDefault(d))));
}
const emptyEl = h("div", { class: "empty", hidden: true });
main.append(emptyEl);

/* ═════════════════ Search ═════════════════ */
const q = document.getElementById("q");
function rowText(r) {
  const d = typeof r.def.desc === "function" ? r.def.desc() : r.def.desc;
  return [r.def.label, d, r.def.keywords].filter(Boolean).join(" ").toLowerCase();
}
function forcedOpen(discId) {
  return !!query && ROWS.some(r => r.def.in === discId && r.match);
}
function highlight(el, text) {
  if (!query) { el.textContent = text; return; }
  const i = text.toLowerCase().indexOf(query);
  el.innerHTML = i < 0 ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + query.length)) + "</mark>" + esc(text.slice(i + query.length));
}
function applyFilter() {
  for (const { s } of SECS) {
    const secHit = query && s.title.toLowerCase().includes(query);
    const rs = ROWS.filter(r => r.sec === s);
    rs.forEach(r => { r.match = !query || secHit || rowText(r).includes(query); });
    // a matching child keeps its parent (the feature row above it) in view
    rs.forEach((r, i) => {
      if (!r.match || !r.def.depth) return;
      for (let j = i - 1; j >= 0; j--) if ((rs[j].def.depth || 0) < r.def.depth) { rs[j].match = true; if (!rs[j].def.depth) break; }
    });
  }
  let any = false;
  for (const { s, sec, group, a } of SECS) {
    let first = true, shown = 0;
    for (const r of ROWS.filter(r => r.sec === s)) {
      const collapsed = r.def.in && !(disclosures[r.def.in] || forcedOpen(r.def.in));
      r.el.hidden = !r.match || collapsed;
      if (!r.el.hidden) { r.el.classList.toggle("first", first); first = false; shown++; }
      highlight(r.labelEl, r.def.label);
      if (r.descEl) {
        const d = typeof r.def.desc === "function" ? r.def.desc() : r.def.desc;
        highlight(r.descEl, d || ""); r.descEl.hidden = !d;
      }
    }
    sec.hidden = shown === 0;
    a.classList.toggle("no-match", shown === 0);
    any ||= shown > 0;
  }
  emptyEl.hidden = any;
  emptyEl.textContent = `No settings match “${q.value.trim()}”`;
}
watch(applyFilter);
q.addEventListener("input", () => { query = q.value.trim().toLowerCase(); refresh(); window.scrollTo({ top: 0 }); spy(); });
q.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (q.value) { q.value = ""; q.dispatchEvent(new Event("input")); } else q.blur(); }
  if (e.key === "Enter") { const first = main.querySelector(".row:not([hidden]) :is(button:not(.reset):not(:disabled), input:not(:disabled), select, textarea)"); first && first.focus(); }
});
document.addEventListener("keydown", e => {
  const typing = e.target.closest("input, textarea, select, [contenteditable]");
  if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); q.select(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); q.focus(); q.select(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && undoFn && !typing) { e.preventDefault(); document.getElementById("toast-undo").click(); }
});

/* ═════════════════ Section index: scroll-spy ═════════════════ */
let active = null;
function setActive(id) {
  if (id === active) return; active = id;
  SECS.forEach(({ s, a }) => a.setAttribute("aria-current", s.id === id ? "true" : "false"));
}
function spy() {
  const vis = SECS.filter(x => !x.sec.hidden);
  if (!vis.length) return;
  const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
  let cur = vis[0];
  for (const x of vis) if (x.sec.getBoundingClientRect().top <= 120) cur = x;
  if (atBottom && vis.at(-1).sec.getBoundingClientRect().top < innerHeight * 0.8) cur = vis.at(-1);
  setActive(cur.s.id);
}
let spyQueued = false;
addEventListener("scroll", () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(() => { spyQueued = false; spy(); }); } }, { passive: true });
index.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  const x = SECS.find(x => "nav-" + x.s.id === a.id);
  x.sec.scrollIntoView({ behavior: reduced.matches ? "auto" : "smooth", block: "start" });
  x.head.querySelector("h2").focus({ preventScroll: true });
  history.replaceState(null, "", "#" + x.s.id);
  setActive(x.s.id);
});
spy();
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();

/* Card colors dialog */
const pd = document.getElementById("palette-dialog");
document.getElementById("palettes").append(...Object.entries(CARD_PALETTES).map(([name, cols]) => {
  const b = h("button", { class: "palette", type: "button" }, h("span", {}, name), h("span", { class: "strip", "aria-hidden": "true" }, cols.map(c => h("span", { style: `background:${c}` }))));
  b.addEventListener("click", () => { pd.close(); withUndo(`Card colors set to ${name}`, () => {}); });
  return b;
}));
document.getElementById("pd-cancel").addEventListener("click", () => pd.close());
</script>
